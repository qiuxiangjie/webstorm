<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <!-- 
        给你一个字符串 s，请你将 s 分割成一些子串，使每个子串都是 回文串 。返回 s 所有可能的分割方案。
        回文串 是正着读和反着读都一样的字符串。


        示例 1：
        输入：s = "aab"
        输出：[["a","a","b"],["aa","b"]]
        示例 2：
        输入：s = "a"
        输出：[["a"]]
     -->

        <script>
            function getS(str) {
                let arr = [];

                backtracking(0,[]);
                function isPalindrome(s) {
                    let i = 0; 
                    let j = s.length - 1;
                    while(i < j){
                        if(s[i] !== s[j]){
                            return false;
                        }
                        i++;
                        j--;
                    }
                    return true;
                }

                function backtracking(j, temp) {
                    if (str.length - 1 < j) {
                        arr.push(temp);
                        return;
                    }
                    let s = "";
                    for (let i = j; i < str.length; i++) {
                        s += str[i];
                        if (isPalindrome(s)) {
                            temp.push(s);
                            backtracking(i + 1,[...temp]);
                            temp.pop();
                        }
                    }
                }
                return arr;
            }

            let a = getS("aabeeoe");
            console.log(a);
        </script>
    </body>
</html>
