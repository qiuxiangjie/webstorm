        // 假设我们有以下HTML字符串
            const htmlString = '<div class="my-class" id="my"><span>Hello, World!</span></div>';

            // 创建一个空的虚拟DOM对象
            const virtualDOM = {
                type: 'div',
                props: {
                    className: 'my-class',
                    children: [],
                },
            };

            // 创建一个函数来递归地将DOM元素转换为虚拟DOM对象
            function convertToVirtualDOM(domElement) {
                const virtualNode = {
                    type: domElement.tagName.toLowerCase(),
                    props: {},
                    children: [],
                };

                // 将DOM元素的属性复制到虚拟DOM对象
                for (let i = 0; i < domElement.attributes.length; i++) {
                    const attr = domElement.attributes[i];
                    virtualNode.props[attr.name] = attr.value;
                }

                // 如果有子元素，则递归地转换它们
                if (domElement.hasChildNodes()) {
                    for (let i = 0; i < domElement.childNodes.length; i++) {
                        const childNode = domElement.childNodes[i];
                        if (childNode.nodeType === 1) { // 只处理元素节点
                            virtualNode.children.push(convertToVirtualDOM(childNode));
                        } else if (childNode.nodeType === 3) { // 处理文本节点
                            virtualNode.children.push({
                                type: 'text',
                                props: {
                                    nodeValue: childNode.nodeValue,
                                },
                            });
                        }
                    }
                }

                return virtualNode;
            }

            // 将HTML字符串转换为DOM元素
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlString;

            // 将DOM元素转换为虚拟DOM对象
            const virtualDOMOfHtmlString = convertToVirtualDOM(tempDiv.firstChild);

            // 输出虚拟DOM对象，以验证结果
            console.log(virtualDOMOfHtmlString);



            // 获取 performance 对象
                const performance = window.performance;

                // 创建一个时间戳来记录页面加载开始的时间
                const startTime = performance.now();

                // 监听 first-contentful-paint 事件
                performance.timing.firstContentfulPaint = 0; // 初始化 FCP 时间戳

                // 监听 first-contentful-paint 事件
                window.addEventListener('first-contentful-paint', (event) => {
                    // 获取 first-contentful-paint 事件触发时的时间戳
                    constfcpTime = event.timeStamp;

                    // 计算 FCP 相对于页面加载开始的时间
                    const fcpDuration = fcpTime - startTime;

                    // 打印 FCP 的值
                    console.log('First Contentful Paint:', fcpDuration, 'milliseconds');
